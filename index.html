main{width:100%;max-width:none;min-height:calc(100svh - 68px);margin:0 auto;padding:clamp(14px,2.5vh,30px) clamp(18px,3vw,56px) clamp(18px,3vh,36px)}.eyebrow{color:var(--mint);text-transform:uppercase;letter-spacing:.18em;font-size:.8rem}.hero h1{font-weight:300;color:var(--yellow);font-size:clamp(2rem,4.5vw,4rem);line-height:1.02;margin:clamp(5px,1vh,12px) 0 clamp(5px,1vh,12px)}.hero p{max-width:700px;color:var(--muted);font-size:1.05rem;line-height:1.7}.progress-area{margin:clamp(12px,2.5vh,28px) 0 clamp(12px,2.3vh,26px);display:flex;align-items:center;gap:16px;color:var(--muted);font-size:.92rem}.progress-track{height:7px;flex:1;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--blue));border-radius:99px;transition:width .4s}.workflow{width:100%;margin:0 auto;display:flex;flex-direction:column;gap:0;perspective:1200px}.step-wrap{position:relative;min-width:0}.step-card{position:relative;width:100%;height:100%;min-height:clamp(132px,18vh,210px);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:clamp(8px,1.5vh,16px);padding:clamp(13px,1.8vh,21px);border:1px solid var(--line);border-radius:19px;background:var(--glass);backdrop-filter:blur(18px);box-shadow:0 12px 24px rgba(0,0,0,.2),inset 0 1px rgba(255,255,255,.2);cursor:pointer;text-align:left;color:inherit;transition:transform .35s cubic-bezier(.2,.8,.2,1),background .3s,border-color .3s,box-shadow .35s;transform-style:preserve-3d}.step-card:hover{transform:translateY(-9px) rotateX(5deg) rotateY(-3deg);background:rgba(255,255,255,.2);border-color:rgba(168,255,207,.85);box-shadow:0 24px 42px rgba(0,0,0,.32),0 0 22px rgba(142,232,255,.14),inset 0 1px rgba(255,255,255,.35)}.step-card:active{transform:translateY(-2px) scale(.985)}.step-card.done{border-color:rgba(168,255,207,.7)}.number{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:rgba( :calc(100vw - 16px);padding:12px;max-height:calc(100svh - 16px)}.details{font-size:clamp(.68rem,1.65vh,.86rem);line-height:1.42}.details>ul{margin:6px 0 10px}.details li{margin:5px 0}}@keyframes spin{to{transform:rotate(360deg)}}.load-copy{flex:1;color:var(--muted);font-size:.9rem}.load-copy strong{display:block;color:var(--mint);font-size:1.05rem;font-weight:400;margin-bottom:5px}.load-track{height:5px;background:rgba(255,255,255,.16);border-radius:99px;margin-top:10px;overflow:hidden}.load-fill{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--blue));transition:width .08s linear}.finished .spinner{animation:none;border-color:var(--mint)}.modal-nav{display:none}.navbtn{border:1px solid var(--line);border-radius:12px;padding:10px 16px;background:rgba(255,255,255,.12);color:white;cursor:pointer;transition:.2s}.navbtn:hover{background:rgba(168,255,207,.2);border-color:var(--mint)}.navbtn:disabled{opacity:.35;cursor:not-allowed}.note{font-size:.79rem;color:rgba(255,255,255,.68);margin-top:clamp(8px,1.5vh,18px)}@media(max-height:760px) and (min-width:761px){.topbar{padding-top:7px;padding-bottom:7px}.skin-trigger{width:36px;height:36px}main{min-height:calc(100svh - 50px);padding-top:10px;padding-bottom:12px}.eyebrow{font-size:.68rem}.hero h1{font-size:clamp(1.8rem,4vw,3rem);margin:4px 0}.progress-area{margin:10px 0 12px}.step-card{min-height:clamp(112px,15vh,150px)}.number{width:38px;height:38px}.step-card h2{font-size:clamp(.88rem,1.2vw,1.1rem);margin-bottom:5px}.step-card p{font-size:.79rem}.card-action{font-size:.75rem}.workflow{gap:clamp(14px,2vh,22px) clamp(25px,2.7vw,48px)}.note{display:none}}

@media(max-width:760px){main{min-height:calc(100svh - 68px);padding:24px 22px 36px}.topbar{align-items:flex-start;flex-direction:column}.workflow-row{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 30px}.row-transition{display:flex}.connector{right:-30px}.step-wrap:nth-child(3n) .connector.down{display:none}.step-wrap:nth-child(2n) .connector:not(.down){display:none}.step-wrap:nth-child(2n) .connector.down{display:grid}}
@media(max-width:520px){.workflow-row{grid-template-columns:1fr;gap:22px}.row-transition{display:flex}.row-transition .arrival{width:100%}.row-transition .route-chain{display:none}.step-card{min-height:175px;padding:19px}.connector{display:none!important}.step-wrap:not(:last-child):after{content:"↓";position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);color:var(--mint);font-size:1.2rem}.progress-area{flex-wrap:wrap}.progress-track{flex-basis:100%;order:2}}
</style>

const workflow=document.getElementById('workflow'),modal=document.getElementById('modal'),dialog=document.getElementById('dialog');let current=0,timer=null,completed=new Set();
function render(){workflow.innerHTML='';const cols=window.innerWidth<=520?1:window.innerWidth<=760?2:window.innerWidth<=1100?3:4;for(let base=0;base<steps.length;base+=cols){const row=document.createElement('div');row.className='workflow-row';const limit=Math.min(base+cols,steps.length);for(let i=base;i<limit;i++){const s=steps[i],wrap=document.createElement('div');wrap.className='step-wrap';const b=document.createElement('button');b.className='step-card'+(completed.has(i)?' done':'');b.innerHTML=`<span class="number">${String(i+1).padStart(2,'0')}</span><span><h2>${s.title}</h2><p>${s.items.length} ${s.items.length===1?'orientação':'orientações'} nesta etapa</p></span><span class="card-action">${completed.has(i)?'Concluída ✓':'Ver etapa ↗'}</span>`;b.onclick=()=>openStep(i);wrap.append(b);if(i<limit-1){const c=document.createElement('button');c.className='connector';c.innerHTML=`<img src="${arrowAsset}" alt="">`;c.title='Avançar para '+steps[i+1].title;c.setAttribute('aria-label','Ir para etapa '+(i+2));c.onclick=()=>openStep(i+1);wrap.append(c)}row.append(wrap)}workflow.append(row);if(limit<steps.length){const turn=document.createElement('button');turn.className='row-transition';turn.title='Da etapa '+limit+' para a etapa '+(limit+1);turn.setAttribute('aria-label','Conectar última etapa da fileira à primeira da próxima fileira');const n=cols===1?0:Math.max(3,cols*2);turn.innerHTML=`<span class="arrival"><img src="${arrowAsset}" alt=""></span><span class="route-chain">${Array.from({length:n},()=>`<img src="${arrowAsset}" alt="">`).join('')}</span>`;turn.onclick=()=>openStep(limit);workflow.append(turn)}}document.getElementById('progressText').textContent=`${completed.size} de ${steps.length} etapas concluídas`;document.getElementById('progressFill').style.width=`${completed.size/steps.length*100}%`;}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openStep(i){current=i;clearInterval(timer);const s=steps[i];document.getElementById('stepLabel').textContent=`ETAPA ${String(i+1).padStart(2,'0')} / ${steps.length}`;document.getElementById('modalTitle').textContent=s.title;document.getElementById('details').innerHTML=s.items.map(([text,subs])=>`<ul><li>${esc(text)}${subs?`<ul>${subs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</li></ul>`).join('');document.getElementById('dialog').classList.remove('finished');document.getElementById('percent').textContent='0%';document.getElementById('loadFill').style.width='0%';document.getElementById('loadMessage').textContent='Carregando orientações da etapa…';modal.classList.add('open');document.getElementById('close').focus();let start=Date.now();timer=setInterval(()=>{let p=Math.min(100,Math.floor((Date.now()-start)/7000*100));document.getElementById('percent').textContent=p+'%';document.getElementById('loadFill').style.width=p+'%';if(p>=100){clearInterval(timer);document.getElementById('dialog').classList.add('finished');document.getElementById('loadMessage').textContent='Orientações carregadas. Leia os itens desta etapa.';completed.add(i);render()}},50)}
function closeModal(){clearInterval(timer);modal.classList.remove('open')}document.getElementById('close').onclick=closeModal;modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.querySelectorAll('.skin').forEach(btn=>btn.onclick=()=>{document.body.dataset.skin=btn.dataset.value;document.querySelectorAll('.skin').forEach(x=>x.classList.toggle('active',x===btn));skinMenu.classList.remove('open');skinTrigger.setAttribute('aria-expanded','false')});const skinTrigger=document.getElementById('skinTrigger'),skinMenu=document.getElementById('skinMenu');skinTrigger.onclick=()=>{const opened=skinMenu.classList.toggle('open');skinTrigger.setAttribute('aria-expanded',String(opened))};document.addEventListener('click',e=>{if(!e.target.closest('.skin-wrap')){skinMenu.classList.remove('open');skinTrigger.setAttribute('aria-expanded','false')}});render();window.addEventListener('resize',()=>{if(!modal.classList.contains('open'))render()});
</script></body></html>
